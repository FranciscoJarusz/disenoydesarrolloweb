<!doctype html>

<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./cuenta.css" />
    <link rel="icon" type="image/png" href="./public/favicon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>MoviePage - Películas, series y reseñas</title>
  </head>

  <body>
    <header>
      <img src="./public/logo.png" height="40px;" class="logo" />
      <nav>
        <ul id="menu">
          <li>
            <a href="./index.html">INICIO</a>
          </li>
          <li>
            <a href="./paginapeliculas.html">PELÍCULAS</a>
          </li>
          <li>
            <a href="./paginaseries.html">SERIES</a>
          </li>
          <li>
            <a href="./reseñas.html">RESEÑAS</a>
          </li>
        </ul>
      </nav>

      <a class="circulo" href="./cuenta.html">
        <img src="./public/account.svg" alt="" height="25px" />
      </a>
    </header>
    <main>
      <div class="login-container">
        <h2>Crear cuenta</h2>

        <form action="" class="form-register">
          <div class="form-group">
            <label for="name">Nombre</label>
            <input
              type="text"
              id="name"
              placeholder="Ingresa tu nombre"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input
              type="email"
              id="email"
              placeholder="ejemplo@correo.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              placeholder="********"
              required
            />
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirmar contraseña</label>
            <input
              type="password"
              id="confirm-password"
              placeholder="********"
              required
            />
          </div>

          <button type="submit">Registrarse</button>
        </form>

        <a href="./cuenta.html" class="footer-link"
          >¿Ya tenés cuenta? Iniciá sesión</a
        >
      </div>
    </main>
    <footer>
      <img src="./public/logo.png" height="40px;" class="logo" />
      <hr />
      <p>&copy; 2026 MoviePage. Todos los derechos reservados.</p>
    </footer>
    <script src="./js/register.js"></script>
  </body>
</html>
