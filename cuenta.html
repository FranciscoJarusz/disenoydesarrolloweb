<!doctype html>

<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./cuenta.css" />
    <link rel="icon" type="image/png" href="./public/favicon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>MoviePage - Películas, series y reseñas</title>
  </head>

  <body>
    <header>
      <a href="./index.html"><img src="./public/logo.png" height="40px;" class="logo" /></a>
      <nav>
        <ul id="menu">
          <li>
            <a href="./index.html">INICIO</a>
          </li>
          <li>
            <a href="./paginapeliculas.html">PELÍCULAS</a>
          </li>
          <li>
            <a href="./paginaseries.html">SERIES</a>
          </li>
          <li>
            <a href="./reseñas.html">RESEÑAS</a>
          </li>
        </ul>
      </nav>

      <a class="circulo" href="./cuenta.html">
        <img src="./public/account.svg" alt="" height="25px" />
      </a>
    </header>
    <main>
      <div class="login-container">
        <h2>Iniciar Sesión</h2>

        <form action="#">
          <div class="form-group">
            <label for="username">Usuario o Correo</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Ingresa tu usuario"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="********"
              required
            />
          </div>

          <div class="form-group checkbox">
            <input type="checkbox" id="remember" name="remember" />
            <label for="remember">Recordarme</label>
          </div>

          <button type="button" onclick="ingresar()">Ingresar</button>
        </form>

        <a href="./register.html" class="footer-link"
          >¿No tenes cuenta? Registrate</a
        >
      </div>
    </main>
    <script src="./js/cuenta.js"></script>
    <footer>
      <a href="./index.html"><img src="./public/logo.png" height="40px;" class="logo" /></a>
      <hr />
      <p>&copy; 2026 MoviePage. Todos los derechos reservados.</p>
    </footer>
  </body>
</html>
